name: Publicar Alondra + Diego 1.6 M

on:
  push:
    branches: [main]
    paths:
      - 'alondra-diego-1-6m/**'
      - '.github/workflows/alondra-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './alondra-diego-1-6m'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
