0}\n  h1{font-size:clamp(40px,6vw,84px);line-height:1.02}\n  h2{font-size:clamp(32px,4.4vw,56px);line-height:1.05}\n  h3{font-size:clamp(22px,2.2vw,28px);line-height:1.15}\n  p{margin:0}\n  .lede{font-size:clamp(17px,1.4vw,20px);line-height:1.5;color:var(--ink-2);max-width:62ch}\n\n  /* ---------- Buttons ---------- */\n  .btn{\n    display:inline-flex;align-items:center;gap:10px;\n    padding:14px 22px;border-radius:2px;\n    font-size:14px;font-weight:500;letter-spacing:0.01em;\n    border:1px solid transparent;cursor:pointer;\n    transition:all .25s ease;font-family:var(--sans);\n    white-space:nowrap;\n  }\n  .btn .arr{transition:transform .25s ease}\n  .btn:hover .arr{transform:translateX(3px)}\n  .btn-primary{background:var(--ink);color:var(--ivory);border-color:var(--ink)}\n  .btn-primary:hover{background:var(--ink-2)}\n  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--ink)}\n  .btn-ghost:hover{background:var(--ink);color:var(--ivory)}\n  .btn-gold{background:var(--gold);color:var(--ivory);border-color:var(--gold)}\n  .btn-gold:hover{background:#a07f3d;border-color:#a07f3d}\n  .btn-wa{background:#0F8A4A;color:#fff;border-color:#0F8A4A}\n  .btn-wa:hover{background:#0a7a3f}\n\n  /* ---------- Nav ---------- */\n  [nav.top](http://nav.top){\n    position:sticky;top:0;z-index:50;\n    background:rgba(247,244,238,0.85);\n    backdrop-filter:saturate(140%) blur(10px);\n    border-bottom:1px solid var(--line);\n  }\n  [nav.top](http://nav.top) .wrap{\n    display:flex;align-items:center;justify-content:space-between;\n    padding-top:18px;padding-bottom:18px;\n  }\n  .brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:20px;letter-spacing:-0.01em}\n  .brand-mark{\n    width:28px;height:28px;border:1px solid var(--ink);position:relative;\n    display:grid;place-items:center;\n  }\n  .brand-mark::before{\n    content:\"\";position:absolute;inset:5px;border:1px solid var(--gold);\n  }\n  .brand-mark::after{\n    con om:14px;\n    font-family:var(--mono);font-size:10px;letter-spacing:0.14em;\n    color:var(--muted);\n  }\n\n  .hero-image{\n    aspect-ratio:4/5;\n    position:relative;\n  }\n  .hero-image .stamp{\n    position:absolute;left:-24px;bottom:48px;\n    background:var(--ink);color:var(--ivory);\n    padding:18px 22px;\n    font-family:var(--mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;\n    max-width:240px;line-height:1.5;\n  }\n  .hero-image .stamp .gold{color:var(--gold-soft);display:block;margin-bottom:6px}\n\n  /* ---------- Section frame ---------- */\n  section{padding:120px 0;position:relative}\n  .section-head{\n    display:grid;grid-template-columns:1fr 2fr;gap:64px;margin-bottom:72px;align-items:end;\n  }\n  @media(max-width:880px){.section-head{grid-template-columns:1fr;gap:24px;margin-bottom:48px}}\n  .section-head .num{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0.16em}\n\n  /* ---------- Services ---------- */\n  .services{background:var(--ivory)}\n  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}\n  @media(max-width:980px){.svc-grid{grid-template-columns:repeat(2,1fr)}}\n  @media(max-width:620px){.svc-grid{grid-template-columns:1fr}}\n  .svc{\n    padding:36px 32px 40px;\n    border-right:1px solid var(--line);\n    border-bottom:1px solid var(--line);\n    background:var(--ivory);\n    transition:background .3s;\n    position:relative;min-height:280px;\n    display:flex;flex-direction:column;\n  }\n  .svc:hover{background:var(--ivory-2)}\n  .svc .ix{\n    font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:0.16em;\n    margin-bottom:24px;\n  }\n  .svc h3{margin-bottom:14px;font-size:24px}\n  .svc p{font-size:14.5px;color:var(--muted);line-height:1.55}\n  .svc .glyph{\n    width:36px;height:36px;margin-bottom:24px;\n    border:1px solid var(--ink);\n    display:grid;place-items:center;\n    color:var(--ink);\n  }\n  .svc .glyph svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4}\n\n  /* ---------- Why us ---------- */\n  .why{background:var(--ink);color:var(--ivory)}\n  .why .eyebrow{color:var(--gold-soft)}\n  .why .eyebrow::before{background:var(--gold-soft)}\n  .why h2{color:var(--ivory)}\n  .why .lede{color:rgba(247,244,238,0.7)}\n  .why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(247,244,238,0.12);border:1px solid rgba(247,244,238,0.12)}\n  @media(max-width:880px){.why-grid{grid-template-columns:1fr}}\n  .why-cell{\n    background:var(--ink);padding:36px 32px 40px;\n    display:flex;flex-direction:column;gap:14px;\n    min-height:220px;\n  }\n  .why-cell .num{font-family:var(--mono);font-size:11px;color:var(--gold-soft);letter-spacing:0.18em}\n  .why-cell h4{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:-0.01em;color:var(--ivory)}\n  .why-cell p{font-size:14px;color:rgba(247,244,238,0.66);line-height:1.55}\n\n  /* ---------- Process ---------- */\n  .process .steps{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-top:1px solid var(--ink)}\n  @media(max-width:1100px){.process .steps{grid-template-columns:repeat(3,1fr)}}\n  @media(max-width:680px){.process .steps{grid-template-columns:repeat(2,1fr)}}\n  @media(max-width:440px){.process .steps{grid-template-columns:1fr}}\n  .step{\n    padding:32px 24px 36px;border-right:1px solid var(--line);position:relative;\n    min-height:240px;display:flex;flex-direction:column;\n  }\n  .step:last-child{border-right:none}\n  .step .n{\n    font-family:var(--serif);font-size:64px;line-height:0.9;color:var(--gold);\n    margin-bottom:28px;font-weight:300;\n  }\n  .step h4{font-family:var(--serif);font-size:18px;font-weight:500;margin-bottom:8px;letter-spacing:-0.01em}\n  .step p{font-size:13.5px;color:var(--muted);line-height:1.5}\n  .step .dot{\n    position:absolute;top:-5px;left:24px;width:9px;height:9px;\n    background:var(--ivory);border:1px solid var(--ink);border-radius:50%;\n  }\n\n  /* ---------- Split sections (propietarios/compradores) ---------- */\n  .split{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n  @media(max-width:880px){.split{grid-template-columns:1fr}}\n  .split-side{padding:80px 56px;border-right:1px solid var(--line)}\n  .split-side:last-child{border-right:none}\n  @media(max-width:880px){.split-side{padding:56px 32px;border-right:none;border-bottom:1px solid var(--line)}.split-side:last-child{border-bottom:none}}\n  .split .tag{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;color:var(--gold);margin-bottom:18px;text-transform:uppercase}\n  .split h2{font-size:clamp(28px,3vw,40px);margin-bottom:16px}\n  .split p{color:var(--muted);max-width:48ch;margin-bottom:28px}\n  .split .ph{height:200px;margin-top:36px}\n\n  /* ---------- Marketing examples ---------- */\n  .marketing{background:var(--ivory-2)}\n  .mkt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}\n  @media(max-width:880px){.mkt-grid{grid-template-columns:repeat(2,1fr)}}\n  @media(max-width:540px){.mkt-grid{grid-template-columns:1fr}}\n  .mkt-card{\n    background:var(--ivory);border:1px solid var(--line);\n    padding:0;overflow:hidden;transition:transform .35s ease,box-shadow .35s ease;\n  }\n  .mkt-card:hover{transform:translateY(-2px);box-shadow:0 24px 48px -32px rgba(11,30,63,0.25)}\n  .mkt-card .ph{height:160px;border:none;border-bottom:1px solid var(--line)}\n  .mkt-card .body{padding:22px 22px 26px}\n  .mkt-card .kicker{font-family:var(--mono);font-size:10px;letter-spacing:0.18em;color:var(--gold);text-transform:uppercase}\n  .mkt-card h4{font-family:var(--serif);font-size:20px;margin:8px 0 8px;font-weight:500}\n  .mkt-card p{font-size:13.5px;color:var(--muted)}\n\n  /* ---------- Legal ---------- */\n  .legal-card{\n    border:1px solid var(--ink);\n    padding:64px 56px;\n    background:var(--ivor 20V10M10 20V6M15 20v-8M20 20v-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h3>Análisis financiero inmobiliario<\u002Fh3>\n        <p>Evaluamos precios de mercado, rentabilidad, retorno de inversión, capacidad de pago, plusvalía y escenarios de compra o renta.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"svc\">\n        <span class=\"ix\">D · 04<\u002Fspan>\n        <span class=\"glyph\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 3h9l5 5v13H6z\"><\u002Fpath><path d=\"M14 3v6h6M9 13h7M9 17h7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h3>Acompañamiento documental<\u002Fh3>\n        <p>Orientamos en la revisión básica de contratos, documentos de propiedad, requisitos notariales y pasos previos a la operación.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"svc\">\n        <span class=\"ix\">E · 05<\u002Fspan>\n        <span class=\"glyph\"><svg viewBox=\"0 0 24 24\"><path d=\"M3 17l6-6 4 4 8-8\"><\u002Fpath><path d=\"M14 7h7v7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h3>Estrategia para inversionistas<\u002Fh3>\n        <p>Analizamos oportunidades de compra, remodelación, renta, reventa y generación de flujo mensual con escenarios comparados.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"svc\">\n        <span class=\"ix\">F · 06<\u002Fspan>\n        <span class=\"glyph\"><svg viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"9\" r=\"4\"><\u002Fcircle><path d=\"M2 21a7 7 0 0 1 14 0\"><\u002Fpath><circle cx=\"17\" cy=\"7\" r=\"3\"><\u002Fcircle><path d=\"M14 14a5 5 0 0 1 8 4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h3>Captación para asesores e inmobiliarias<\u002Fh3>\n        <p>Diseñamos embudos digitales para inmobiliarias, brokers, despachos o asesores que quieren más clientes calificados.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== POR QUÉ ELEGIRNOS ============== -->\n<section class=\"why\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <di rios<\u002Fspan>\n      <h2>¿Quieres vender o rentar tu propiedad?<\u002Fh2>\n      <p>Te ayudamos a presentarla de forma profesional, calcular un precio competitivo y atraer prospectos mediante campañas digitales segmentadas con datos reales del mercado.<\u002Fp>\n      <a href=\"#contacto\" class=\"btn btn-primary\">Publicar mi propiedad <span class=\"arr\">→<\u002Fspan><\u002Fa>\n      <div class=\"ph\" aria-label=\"Imagen — interior fotografiado profesionalmente o ficha de propiedad\">\n        <span class=\"label\">IMG · Ficha de propiedad<\u002Fspan>\n        <span class=\"corner\">drop_in: foto profesional de inmueble<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"split-side reveal\" id=\"inversionistas\">\n      <span class=\"tag\">Para compradores e inversionistas<\u002Fspan>\n      <h2>Compra con análisis, no con impulso.<\u002Fh2>\n      <p>Antes de invertir, revisamos precio, zona, rentabilidad, riesgos, documentación básica y escenarios financieros — para ayudarte a decidir mejor y con tranquilidad.<\u002Fp>\n      <a href=\"#contacto\" class=\"btn btn-gold\">Quiero analizar una propiedad <span class=\"arr\">→<\u002Fspan><\u002Fa>\n      <div class=\"ph\" aria-label=\"Imagen — escenario financiero, comparativo o reporte de inversión\">\n        <span class=\"label\">IMG · Análisis financiero<\u002Fspan>\n        <span class=\"corner\">drop_in: dashboard / comparativo / reporte<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== MARKETING ============== -->\n<section class=\"marketing\" id=\"marketing\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <div><span class=\"eyebrow\">04 — Marketing digital<\u002Fspan><\u002Fdiv>\n      <div>\n        <h2>Publicidad inmobiliaria que genera contactos reales.<\u002Fh2>\n        <p class=\"lede\" style=\"margin-top:20px;color:var(--muted)\">\n          Diseñamos campañas para captar prospectos por WhatsApp, formularios o llamadas, usando segmentación por zona, presupuesto, intención de compra y perfil del cliente.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mkt-grid reveal\">\n      <article class=\"mkt-card\">\n        <div class=\"ph\"><span class=\"label\">CAMPAÑA · 01<\u002Fspan><span class=\"corner\">creative · venta de casa<\u002Fspan><\u002Fdiv>\n        <div class=\"body\"><span class=\"kicker\">Venta<\u002Fspan><h4>Casas residenciales<\u002Fh4><p>Captación segmentada por zona, capacidad de pago y perfil familiar.<\u002Fp><\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"mkt-card\">\n        <div class=\"ph\"><span class=\"label\">CAMPAÑA · 02<\u002Fspan><span class=\"corner\">creative · renta dpto<\u002Fspan><\u002Fdiv>\n        <div class=\"body\"><span class=\"kicker\">Renta<\u002Fspan><h4>Departamentos<\u002Fh4><p>Anuncios orientados a inquilinos calificados con intención inmediata.<\u002Fp><\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"mkt-card\">\n        <div class=\"ph\"><span class=\"label\">CAMPAÑA · 03<\u002Fspan><span class=\"corner\">creative · inversión<\u002Fspan><\u002Fdiv>\n        <div class=\"body\"><span class=\"kicker\">Inversión<\u002Fspan><h4>Captación de inversionistas<\u002Fh4><p>Comunicación enfocada en rentabilidad, plusvalía y escenarios.<\u002Fp><\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"mkt-card\">\n        <div class=\"ph\"><span class=\"label\">CAMPAÑA · 04<\u002Fspan><span class=\"corner\">creative · terreno<\u002Fspan><\u002Fdiv>\n        <div class=\"body\"><span class=\"kicker\">Terrenos<\u002Fspan><h4>Promoción de terrenos<\u002Fh4><p>Estrategia para usos posibles, plusvalía proyectada y zonificación.<\u002Fp><\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"mkt-card\">\n        <div class=\"ph\"><span class=\"label\">CAMPAÑA · 05<\u002Fspan><span class=\"corner\">creative · desarrollo<\u002Fspan><\u002Fdiv>\n        <div class=\"body\"><span class=\"kicker\">P
